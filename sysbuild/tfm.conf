# ipc_dfu_helper/sysbuild/tfm.conf
#
# TF-M configuration for the FMFU helper image.
#
# The fmfu_smp_svr documentation requires: "TF-M logging must use the
# same UART as the application."  If TF-M uses UART1 (its default) while
# the NS app uses UART0, TF-M never configures UART0 as non-secure in
# the SPU.  The UART0 interrupt then fires only in secure context, and
# the NS uart_mcumgr ISR is never called.
#
# Silencing TF-M logging here ensures TF-M does not attempt to use UART1
# (leaving it un-initialized), and UART0 is properly assigned to the NS
# domain (the SPU configuration that routes UART0 to NS is independent of
# TF-M's logging config).
#
# If TF-M log output is needed for debugging, replace SILENCE with NOTICE
# and ensure the shared TF-M logging guide is followed so TF-M also uses
# UART0 (same UART as the NS app).

CONFIG_TFM_LOG_LEVEL_SILENCE=y